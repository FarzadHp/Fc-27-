name: windows-check
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Expand project zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "FFS_Controller_Bridge*.zip" | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath . -Force
      - name: Install
        working-directory: FFS_Controller_Bridge
        run: python -m pip install jsonschema==4.26.0 PySDL2==0.9.17 pysdl2-dll==2.32.10
      - name: Environment
        working-directory: FFS_Controller_Bridge
        run: python -c "import sys, tkinter as tk; r=tk.Tk(); print(sys.version); print('Tk', r.tk.call('info','patchlevel')); r.destroy()"
      - name: Unit tests
        working-directory: FFS_Controller_Bridge
        run: python -m unittest discover -s tests -v
      - name: Stress fake Preview
        working-directory: FFS_Controller_Bridge
        run: python tools/stress_ui.py --interactions 800 --warmup 80 --step-ms 10 --out out/stress_ui
      - name: Apply stress
        working-directory: FFS_Controller_Bridge
        run: python tools/gui_stress.py --cycles 300 --applies 50 --csv out/gui_stress.csv
      - name: Menu panic experiment
        continue-on-error: true
        working-directory: FFS_Controller_Bridge
        run: |
          python tools/repro_menu_panic.py cold --out out/repro_cold
          python tools/repro_menu_panic.py warm --out out/repro_warm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: FFS_Controller_Bridge/out/
