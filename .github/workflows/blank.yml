name: windows-check
on:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Expand newest project zip
        run: |
          ZIP=$(ls FFS_Controller_Bridge*.zip | sort | tail -1)
          echo "Using $ZIP"
          rm -rf FFS_Controller_Bridge
          unzip -q -o "$ZIP"
          mkdir -p FFS_Controller_Bridge/out
      - name: Install
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python -m pip install jsonschema==4.26.0 PySDL2==0.9.17 pysdl2-dll==2.32.10 2>&1 | tee out/01_install.txt
      - name: Environment
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python -c "import sys, tkinter as tk; r=tk.Tk(); print(sys.version); print('Tk', r.tk.call('info','patchlevel')); r.destroy()" 2>&1 | tee out/02_env.txt
      - name: Unit tests
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python -m unittest discover -s tests -v 2>&1 | tee out/03_unit_tests.txt
      - name: Stress fake Preview
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python tools/stress_ui.py --interactions 800 --warmup 80 --step-ms 10 --out out/stress_ui 2>&1 | tee out/04_stress_ui.txt
      - name: Apply stress
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python tools/gui_stress.py --cycles 300 --applies 50 --csv out/gui_stress.csv 2>&1 | tee out/05_gui_stress.txt
      - name: Menu panic experiment
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: |
          python tools/repro_menu_panic.py cold --out out/repro_cold 2>&1 | tee out/06_repro_cold.txt
          python tools/repro_menu_panic.py warm --out out/repro_warm 2>&1 | tee out/07_repro_warm.txt
      - name: SDL handle probe (real SDL2 DLL, no controller)
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python tools/sdl_handle_probe.py --iterations 300 2>&1 | tee out/08_sdl_probe.txt
      - name: Long stress (3000 interactions)
        working-directory: FFS_Controller_Bridge
        continue-on-error: true
        run: python tools/stress_ui.py --interactions 3000 --warmup 100 --step-ms 5 --seed 2 --out out/stress_long 2>&1 | tee out/09_stress_long.txt
      - name: Show results in log
        if: always()
        working-directory: FFS_Controller_Bridge
        run: |
          for f in out/0*.txt; do
            echo "=================== $f"
            grep -nE "^(FAIL|ERROR):|Traceback|Error|RESULT|exit=|IsWindow|windows created|Ran |^OK|FAILED|USER|after phase|start " "$f" | tail -n 30 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results
          path: FFS_Controller_Bridge/out/
